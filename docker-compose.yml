services:
  # ========================================================================
  # DATABASES
  # ========================================================================

  postgres-primary:
    image: postgis/postgis:15-3.4
    container_name: sigsan-postgres-primary
    # Superusuario de bootstrap = "postgres" (so init e operacao). A aplicacao usa sigsan_app e as
    # migrations usam sigsan_migrator, criadas por infra/postgres/init com as senhas abaixo. Sem
    # valor padrao: defina no .env (ver .env.example); o compose recusa subir sem elas.
    environment:
      POSTGRES_DB: sigsan
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?defina POSTGRES_SUPERUSER_PASSWORD no .env}
      SIGSAN_APP_PASSWORD: ${SIGSAN_APP_PASSWORD:?defina SIGSAN_APP_PASSWORD no .env}
      SIGSAN_MIGRATOR_PASSWORD: ${SIGSAN_MIGRATOR_PASSWORD:?defina SIGSAN_MIGRATOR_PASSWORD no .env}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?defina KEYCLOAK_DB_PASSWORD no .env}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    volumes:
      - postgres-primary-data:/var/lib/postgresql/data
      - ${SIGSAN_PG_INIT_DIR:-./infra/postgres/init}:/docker-entrypoint-initdb.d:ro
    ports:
      # So na maquina local: o banco nao fica exposto na rede.
      - "127.0.0.1:5432:5432"
    command: >
      postgres
      -c max_connections=200
      -c shared_buffers=256MB
      -c effective_cache_size=1GB
      -c maintenance_work_mem=128MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c default_statistics_target=100
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c work_mem=4MB
      -c min_wal_size=1GB
      -c max_wal_size=4GB
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sigsan"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G

  # postgres-replica: removido em 12/10/2026. Nao replicava nada (a imagem postgis ignora
  # PG_PRIMARY_*), nao recebia o init de seguranca e expunha na porta 5433 um PostgreSQL em que
  # sigsan_app era superusuario. Replicacao real fica para a infraestrutura de producao.

  timescaledb:
    image: timescale/timescaledb:latest-pg15
    container_name: sigsan-timescaledb
    environment:
      POSTGRES_DB: sigsan_ts
      POSTGRES_USER: sigsan_ts
      POSTGRES_PASSWORD: ${TIMESCALE_PASSWORD:-timescale_dev_password}
    volumes:
      - timescaledb-data:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    command: >
      postgres
      -c shared_preload_libraries=timescaledb
      -c max_connections=100
      -c shared_buffers=256MB
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sigsan_ts -d sigsan_ts"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ========================================================================
  # CACHE & QUEUE
  # ========================================================================

  redis:
    image: redis:7-alpine
    container_name: sigsan-redis
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: sigsan-kafka
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_SEGMENT_BYTES: 1073741824
    ports:
      - "9092:9092"
      - "9093:9093"
    volumes:
      - kafka-data:/var/lib/kafka/data
    depends_on:
      - zookeeper
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 5

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: sigsan-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
    healthcheck:
      # A imagem nao tem zkServer.sh no PATH, e o 4lw ruok esta desabilitado por padrao.
      # Verificar que a porta 2181 aceita conexao TCP e o suficiente: e o que o Kafka usa.
      test: ["CMD-SHELL", "timeout 3 bash -c '</dev/tcp/127.0.0.1/2181'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ========================================================================
  # OBJECT STORAGE (S3 compatible)
  # ========================================================================

  minio:
    image: chrislusf/seaweedfs:3.60
    container_name: sigsan-minio
    command: server -dir=/data -filer=true -s3=true -s3.port=9000 -master.port=9333 -volume.port=8081 -filer.port=8888 -ip=0.0.0.0
    environment:
      MINIO_ROOT_USER: sigsan
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-minio_dev_password}
    volumes:
      - minio-data:/data
    ports:
      - "9000:9000"
      - "8888:8888"
      - "9333:9333"
      - "8081:8081"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9333/dir/status || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ========================================================================
  # AUTH & SECRETS
  # ========================================================================

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: sigsan-keycloak
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_DB: postgres
      # Banco e role proprios (criados por infra/postgres/init/00-roles.sh). Antes o Keycloak usava o
      # banco sigsan com a role da aplicacao, e suas tabelas ficavam em public ao lado de audit_log.
      KC_DB_URL: jdbc:postgresql://postgres-primary:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?defina KEYCLOAK_DB_PASSWORD no .env}
      KC_HOSTNAME: localhost
      KC_HTTP_ENABLED: "true"
      KC_HTTP_PORT: 8080
      KC_PROXY: edge
    volumes:
      - ./infra/keycloak/realms:/opt/keycloak/data/import:ro
    ports:
      - "8080:8080"
    depends_on:
      - postgres-primary
    healthcheck:
      # A imagem do Keycloak não tem curl nem wget. O endpoint de health do Keycloak
      # responde Management, e não o /health da Quarkus, então o caminho correto é
      # /realms/master. Sem isso o healthcheck falhava com "curl: command not found".
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080 && echo -e 'GET /realms/master HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q '200'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  vault:
    image: hashicorp/vault:1.15
    container_name: sigsan-vault
    command: server -dev -dev-root-token-id="dev-root-token" -dev-listen-address="0.0.0.0:8200"
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: dev-root-token
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    ports:
      - "8200:8200"
    cap_add:
      - IPC_LOCK
    healthcheck:
      # VAULT_ADDR precisa ser http:// porque o modo dev deste compose nao tem TLS.
      # Sem isso o cliente tenta HTTPS e falha com "server gave HTTP response to HTTPS client".
      test: ["CMD-SHELL", "VAULT_ADDR=http://127.0.0.1:8200 vault status"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

