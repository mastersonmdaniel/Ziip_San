apiVersion: v1
kind: Namespace
metadata:
  name: sigsan
  labels:
    name: sigsan
    environment: dev
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: sigsan-quota
  namespace: sigsan
spec:
  hard:
    requests.cpu: "16"
    requests.memory: 32Gi
    limits.cpu: "32"
    limits.memory: 64Gi
    persistentvolumeclaims: "20"
    services: "20"
    secrets: "50"
    configmaps: "50"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: sigsan-limits
  namespace: sigsan
spec:
  limits:
  - default:
      cpu: "1000m"
      memory: "2Gi"
    defaultRequest:
      cpu: "250m"
      memory: "512Mi"
    type: Container