apiVersion: apps/v1
kind: Deployment
metadata:
  name: pyroscope
  namespace: sigsan
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pyroscope
  template:
    metadata:
      labels:
        app: pyroscope
    spec:
      containers:
      - name: pyroscope
        image: grafana/pyroscope:1.5.0
        ports:
        - containerPort: 4040
          name: http
        volumeMounts:
        - name: data
          mountPath: /var/lib/pyroscope
        resources:
          requests:
            cpu: "250m"
            memory: "1Gi"
          limits:
            cpu: "1000m"
            memory: "4Gi"
        livenessProbe:
          httpGet:
            path: /ready
            port: 4040
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 4040
          initialDelaySeconds: 10
          periodSeconds: 5
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: pyroscope-data
---
apiVersion: v1
kind: Service
metadata:
  name: pyroscope
  namespace: sigsan
spec:
  type: ClusterIP
  ports:
  - port: 4040
    targetPort: 4040
  selector:
    app: pyroscope