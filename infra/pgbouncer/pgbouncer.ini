; P0.28: PgBouncer em modo transaction. Em modo transaction, cada transacao pode
; usar uma conexao fisica diferente do pool — por isso o contexto de tenant tem de
; ser LOCAL a transacao (set_config ..., true), nunca de sessao (ver
; MultiTenantConnectionProvider). server_reset_query descarta o que restar ao fim
; de cada transacao, como segunda barreira contra vazamento entre tenants.
[databases]
ziipsan = host=postgres-primary port=5432 dbname=ziipsan

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
pool_mode = transaction
server_reset_query = DISCARD ALL
max_client_conn = 200
default_pool_size = 20
min_pool_size = 5
reserve_pool_size = 5
ignore_startup_parameters = extra_float_digits
admin_users = postgres
stats_users = postgres
