# ED-04 -- Pacote de reversao (ADR-0024, itens 3 e 4).
#
# Base: docker-compose.yml real do ambiente local da P0.27, HEAD 2ba51f8.
# Este arquivo espelha a fiacao daquele compose (servicos, variaveis,
# healthchecks e comandos), adaptada para o pacote de reversao. Onde o
# pacote diverge do compose de desenvolvimento, a divergencia e DECLARADA
# abaixo -- nao e convencao inventada.
#
# Componentes do pacote (ADR-0024, item 3): imagem da aplicacao,
# PostgreSQL 17 com PostGIS 3.5, Keycloak, cofre proprio e armazenamento
# de objetos compativel com S3. Cofre e S3 entram SO neste pacote, como
# excecao registrada no ADR-0010 (ADR-0024, item 4): por isso aqui eles
# sao obrigatorios, SEM perfil -- no compose de dev sao perfis opcionais
# (vault / storage).
#
# Divergencias declaradas em relacao ao compose de dev:
#   1. SEM PgBouncer no pacote: ZIIPSAN_DB_URL aponta direto para
#      postgres-primary:5432. O proprio projeto usa conexao direta fora
#      do perfil pool (a API local de dev aponta para o PostgreSQL
#      direto); o pacote segue esse caminho e nao sobe o servico
#      pgbouncer.
#   2. Keycloak SEM TLS local no pacote: o compose real usa certificados
#      gerados por scripts/local-tls.sh, fora do repositorio. Sem esses
#      arquivos, KC_HTTPS_* e o volume de certs nao entram aqui; o
#      Keycloak publica so em 127.0.0.1 (HTTP local).
#   3. Caminhos relativos ao pacote: este compose mora em reversao/ e os
#      diretorios de init/realm/config moram em ../infra/... no layout
#      do repositorio, sobrescreviveis por variavel:
#      REVERSAO_PG_INIT_DIR, REVERSAO_KC_IMPORT_DIR e REVERSAO_VAULT_CONFIG.
#   4. A api NAO depende do servico migrate neste compose: a ordem
#      (infraestrutura -> migrate -> api) e garantida pelo subir.sh,
#      como o ambiente real faz com scripts/local-env.sh. Assim o
#      `docker compose up` nao dispara uma segunda execucao do migrate
#      como dependencia (fecha o P10 da revisao da ED-04).
#   5. Keycloak sem cache replicado: o pacote nao define KC_CACHE/
#      KC_CACHE_STACK (no compose de dev, ispn + jdbc-ping servem as
#      replicas do perfil ha; o pacote tem UMA replica, com o cache
#      local padrao da imagem).
#   6. Variavel da imagem da aplicacao: aqui ZIIPSAN_IMAGE, obrigatoria
#      e sem default -- e a tag fixa da imagem entregue com o pacote.
#      O compose de dev usa ZIIPSAN_APP_IMAGE com default
#      ziipsan-app:local; no pacote nenhuma tag e presumida.
#
# Selecao de processo e por `command: api` / `command: migrate`, como no
# compose real. NAO existe ZIIPSAN_PROCESS e NAO existe servico/processo
# worker no ambiente da P0.27 -- nenhum dos dois entra neste pacote.
#
# Nenhuma senha tem valor padrao neste arquivo: todas usam ${VAR:?} e o
# compose recusa subir sem elas (ver .env.reversao.example). Portas do
# banco, do Keycloak, do cofre e do S3 so em 127.0.0.1; a da api e
# parametrizavel com default 127.0.0.1 (REVERSAO_API_BIND).

name: ziipsan-reversao

services:
  # ========================================================================
  # BANCO DE DADOS
  # ========================================================================

  postgres-primary:
    # ADR-0024, item 3: o banco do pacote e PostgreSQL 17 com PostGIS 3.5.
    # Imagem fixa neste arquivo (nao e o 15-3.4 do compose de dev, que tem
    # pendencia propria registrada la -- P0.4).
    image: postgis/postgis:17-3.5
    container_name: ziipsan-reversao-postgres-primary
    # Superusuario de bootstrap = "postgres" (so init e operacao). A aplicacao usa ziipsan_app e as
    # migrations usam ziipsan_migrator, criadas por infra/postgres/init com as senhas abaixo. Sem
    # valor padrao: defina no .env.reversao (ver .env.reversao.example); o compose recusa subir sem elas.
    environment:
      POSTGRES_DB: ziipsan
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?defina POSTGRES_SUPERUSER_PASSWORD no .env.reversao}
      ZIIPSAN_APP_PASSWORD: ${ZIIPSAN_APP_PASSWORD:?defina ZIIPSAN_APP_PASSWORD no .env.reversao}
      ZIIPSAN_MIGRATOR_PASSWORD: ${ZIIPSAN_MIGRATOR_PASSWORD:?defina ZIIPSAN_MIGRATOR_PASSWORD no .env.reversao}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?defina KEYCLOAK_DB_PASSWORD no .env.reversao}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    volumes:
      - postgres-primary-data:/var/lib/postgresql/data
      - postgres-wal-archive:/var/lib/postgresql/wal-archive
      - ${REVERSAO_PG_INIT_DIR:-../infra/postgres/init}:/docker-entrypoint-initdb.d:ro
    ports:
      # So na maquina local: o banco nao fica exposto na rede.
      - "127.0.0.1:${REVERSAO_DB_PORT:-5432}:5432"
    command: >
      postgres
      -c wal_level=replica
      -c archive_mode=on
      -c archive_command='test ! -f /var/lib/postgresql/wal-archive/%f && cp %p /var/lib/postgresql/wal-archive/%f'
      # P0.8: pg_stat_statements so coleta com preload (ver security.sql).
      -c shared_preload_libraries=pg_stat_statements
      -c max_connections=200
      -c shared_buffers=256MB
      -c effective_cache_size=1GB
      -c maintenance_work_mem=128MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c default_statistics_target=100
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c work_mem=4MB
      -c min_wal_size=1GB
      -c max_wal_size=4GB
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ziipsan"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G

  # ========================================================================
  # ARMAZENAMENTO DE OBJETOS (compativel com S3)
  # ========================================================================

  minio:
    # ADR-0024, itens 3 e 4: armazenamento compativel com S3 e componente
    # obrigatorio do pacote (sem perfil; no compose de dev e o perfil
    # storage). Implementacao e a mesma do ambiente real: SeaweedFS.
    image: chrislusf/seaweedfs:3.60
    container_name: ziipsan-reversao-minio
    command: server -dir=/data -filer=true -s3=true -s3.port=9000 -master.port=9333 -volume.port=8081 -filer.port=8888 -ip=127.0.0.1
    environment:
      MINIO_ROOT_USER: ziipsan
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:?defina MINIO_PASSWORD no .env.reversao}
    volumes:
      - minio-data:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:8888:8888"
      - "127.0.0.1:9333:9333"
      - "127.0.0.1:8081:8081"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9333/dir/status || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ========================================================================
  # AUTENTICACAO E COFRE
  # ========================================================================

  keycloak:
    # Tag exata (nao "latest" nem "26"): a imagem so muda quando este arquivo muda.
    image: quay.io/keycloak/keycloak:26.8.0
    container_name: ziipsan-reversao-keycloak
    # --import-realm importa o realm de infra/keycloak/realms so se o realm ainda NAO existir
    # (estrategia IGNORE_EXISTING): mudar o JSON nao altera um realm ja criado; para reimportar,
    # apague o realm no console ou recrie o banco keycloak.
    # Sem TLS local neste pacote (divergencia declarada 2, no cabecalho):
    # sem KC_HTTPS_* e sem o volume de certificados do compose de dev.
    command: >
      sh -c "kc.sh build && exec kc.sh start --optimized --import-realm"
    environment:
      # Admin temporario de bootstrap do Keycloak 26 (as KEYCLOAK_ADMIN* antigas foram removidas).
      # Sem senha padrao: o compose recusa subir sem KEYCLOAK_ADMIN_PASSWORD no .env.reversao.
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?defina KEYCLOAK_ADMIN_PASSWORD no .env.reversao}
      KC_DB: postgres
      # Banco e role proprios (criados por infra/postgres/init/00-roles.sh). Antes o Keycloak usava o
      # banco ziipsan com a role da aplicacao, e suas tabelas ficavam em public ao lado de audit_log.
      KC_DB_URL: jdbc:postgresql://postgres-primary:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?defina KEYCLOAK_DB_PASSWORD no .env.reversao}
      # URL publica: o iss dos tokens e sempre
      # http://localhost:<porta>/realms/ziipsan, que e o emissor que o backend valida, mesmo quando o
      # backend chama o Keycloak pela rede interna (liberado pelo
      # BACKCHANNEL_DYNAMIC para o JWKS e o token endpoint).
      # Se REVERSAO_KC_PORT mudar, ajuste tambem ZIIPSAN_OIDC_ISSUER no .env.reversao.
      KC_HOSTNAME: http://localhost:${REVERSAO_KC_PORT:-8080}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "true"
      KC_HTTP_PORT: 8080
      # /health/ready na porta de gerenciamento (9000, nao publicada).
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ${REVERSAO_KC_IMPORT_DIR:-../infra/keycloak/realms}:/opt/keycloak/data/import:ro
    ports:
      # So na maquina local.
      - "127.0.0.1:${REVERSAO_KC_PORT:-8080}:8080"
    depends_on:
      postgres-primary:
        condition: service_healthy
    healthcheck:
      # A imagem do Keycloak nao tem curl nem wget: o teste usa o /dev/tcp do bash.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q ' 200'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  vault:
    # ADR-0024, itens 3 e 4: cofre proprio e componente obrigatorio do
    # pacote (sem perfil; no compose de dev e o perfil vault).
    # Token fora do repositorio (sem padrao). Porta so local.
    image: hashicorp/vault:1.16.3
    container_name: ziipsan-reversao-vault
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_ADDR: http://127.0.0.1:8200
      VAULT_TOKEN: ${VAULT_TOKEN:?defina VAULT_TOKEN no .env.reversao}
    volumes:
      - vault-data:/vault/data
      - ${REVERSAO_VAULT_CONFIG:-../infra/vault/config.hcl}:/vault/config/config.hcl:ro
    ports:
      - "127.0.0.1:8200:8200"
    command: server -config=/vault/config/config.hcl
    healthcheck:
      test: ["CMD-SHELL", "vault status -address=http://127.0.0.1:8200 >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ========================================================================
  # APLICACAO
  # ========================================================================

  api:
    # A API pela mesma imagem entregue com o pacote. A tag vem de
    # ZIIPSAN_IMAGE (tag fixa, sem latest, no .env.reversao).
    # Sem PgBouncer no pacote (divergencia declarada 1): ZIIPSAN_DB_URL
    # aponta direto para postgres-primary:5432.
    # Sem dependencia do servico migrate (divergencia declarada 4): a
    # ordem e garantida pelo subir.sh; a api depende so da infraestrutura
    # de que precisa saudavel para atender.
    image: ${ZIIPSAN_IMAGE:?defina ZIIPSAN_IMAGE com tag fixa, sem latest, no .env.reversao}
    container_name: ziipsan-reversao-api
    command: api
    environment:
      ZIIPSAN_PORT: 8090
      ZIIPSAN_DB_URL: jdbc:postgresql://postgres-primary:5432/ziipsan
      ZIIPSAN_DB_APP_USER: ziipsan_app
      ZIIPSAN_DB_APP_PASSWORD: ${ZIIPSAN_APP_PASSWORD:?defina ZIIPSAN_APP_PASSWORD no .env.reversao}
      ZIIPSAN_DB_MIGRATOR_USER: ziipsan_migrator
      ZIIPSAN_DB_MIGRATOR_PASSWORD: ${ZIIPSAN_MIGRATOR_PASSWORD:?defina ZIIPSAN_MIGRATOR_PASSWORD no .env.reversao}
      ZIIPSAN_OIDC_ISSUER: ${ZIIPSAN_OIDC_ISSUER:-http://localhost:8080/realms/ziipsan}
      ZIIPSAN_CRYPTO_PROVIDER: ${ZIIPSAN_CRYPTO_PROVIDER:-dev-env}
      ZIIPSAN_DEV_MASTER_KEY: ${ZIIPSAN_DEV_MASTER_KEY:-}
      ZIIPSAN_CORS_ORIGINS: ${ZIIPSAN_CORS_ORIGINS:-http://localhost:3000}
      # Guarda de perfil (P0.27): falsa em TODOS os perfis locais. Nunca trocar para true aqui.
      ZIIPSAN_FISCAL_PRODUCTION_ALLOWED: "false"
    ports:
      - "${REVERSAO_API_BIND:-127.0.0.1}:${REVERSAO_API_PORT:-8090}:8090"
    depends_on:
      postgres-primary:
        condition: service_healthy
      keycloak:
        condition: service_healthy

  migrate:
    # O job migrate, pela mesma imagem da API. Roda antes da api, acionado
    # pelo subir.sh (docker compose run --rm migrate), e sai apos migrar.
    image: ${ZIIPSAN_IMAGE:?defina ZIIPSAN_IMAGE com tag fixa, sem latest, no .env.reversao}
    container_name: ziipsan-reversao-migrate
    command: migrate
    environment:
      ZIIPSAN_DB_URL: jdbc:postgresql://postgres-primary:5432/ziipsan
      ZIIPSAN_DB_APP_USER: ziipsan_app
      ZIIPSAN_DB_APP_PASSWORD: ${ZIIPSAN_APP_PASSWORD:?defina ZIIPSAN_APP_PASSWORD no .env.reversao}
      ZIIPSAN_DB_MIGRATOR_USER: ziipsan_migrator
      ZIIPSAN_DB_MIGRATOR_PASSWORD: ${ZIIPSAN_MIGRATOR_PASSWORD:?defina ZIIPSAN_MIGRATOR_PASSWORD no .env.reversao}
      ZIIPSAN_DB_MIGRATE_ON_STARTUP: "true"
      ZIIPSAN_OIDC_ISSUER: ${ZIIPSAN_OIDC_ISSUER:-http://localhost:8080/realms/ziipsan}
      ZIIPSAN_CRYPTO_PROVIDER: ${ZIIPSAN_CRYPTO_PROVIDER:-dev-env}
      ZIIPSAN_DEV_MASTER_KEY: ${ZIIPSAN_DEV_MASTER_KEY:-}
      ZIIPSAN_FISCAL_PRODUCTION_ALLOWED: "false"
    depends_on:
      postgres-primary:
        condition: service_healthy

volumes:
  postgres-primary-data:
  postgres-wal-archive:
  vault-data:
  minio-data:
