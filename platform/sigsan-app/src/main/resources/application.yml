# Configuração da aplicação SIGSAN. Nenhum segredo aqui: tudo que é senha, endereço ou chave vem de
# variável de ambiente, SEM valor padrão (a subida falha listando o que falta). Ver .env.example.
spring:
  application:
    name: sigsan
  main:
    web-application-type: servlet
  # O Flyway do Boot fica DESLIGADO: com flyway-core no classpath ele varreria db/migration de forma
  # recursiva e aplicaria as migrations de tenant em public. Quem migra é o DatabaseMigrator (platform).
  flyway:
    enabled: false
  jpa:
    open-in-view: false
  mvc:
    problemdetails:
      enabled: true
  # O frontend envia campos que o cadastro ainda não modela (ex.: rg, motherName, costCenter); cada DTO
  # lê só o que conhece, explicitamente. Recusar o corpo inteiro por um campo a mais travaria as telas.
  jackson:
    deserialization:
      fail-on-unknown-properties: false

server:
  port: ${SIGSAN_PORT:8090}
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

sigsan:
  db:
    url: ${SIGSAN_DB_URL}
    app-user: ${SIGSAN_DB_APP_USER:sigsan_app}
    app-password: ${SIGSAN_DB_APP_PASSWORD}
    migrator-user: ${SIGSAN_DB_MIGRATOR_USER:sigsan_migrator}
    migrator-password: ${SIGSAN_DB_MIGRATOR_PASSWORD}
    # Produção: false (migrations num job separado antes da troca de versão). Local/teste: true.
    migrate-on-startup: ${SIGSAN_DB_MIGRATE_ON_STARTUP:false}
  oidc:
    issuer: ${SIGSAN_OIDC_ISSUER}
    jwk-set-uri: ${SIGSAN_OIDC_JWK_SET_URI:}
    audience: ${SIGSAN_OIDC_AUDIENCE:sigsan-api}
  cors:
    allowed-origins: ${SIGSAN_CORS_ORIGINS:}
  # Provedor das chaves de cifra por tenant (CryptoConfig). Sem valor a aplicação não sobe. "dev-env"
  # (chave mestra em SIGSAN_DEV_MASTER_KEY) só fora de produção; o do Vault ainda não existe.
  crypto:
    provider: ${SIGSAN_CRYPTO_PROVIDER:}
  keycloak:
    admin:
      enabled: false
