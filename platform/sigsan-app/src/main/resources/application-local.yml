# Perfil local (SPRING_PROFILES_ACTIVE=local): PostgreSQL e Keycloak do docker-compose nesta máquina.
# As senhas continuam vindo do ambiente (.env): SIGSAN_DB_APP_PASSWORD, SIGSAN_DB_MIGRATOR_PASSWORD.
sigsan:
  db:
    url: ${SIGSAN_DB_URL:jdbc:postgresql://localhost:5432/sigsan}
    migrate-on-startup: ${SIGSAN_DB_MIGRATE_ON_STARTUP:true}
  oidc:
    issuer: ${SIGSAN_OIDC_ISSUER:http://localhost:8080/realms/sigsan}
    jwk-set-uri: ${SIGSAN_OIDC_JWK_SET_URI:http://localhost:8080/realms/sigsan/protocol/openid-connect/certs}
  cors:
    allowed-origins: ${SIGSAN_CORS_ORIGINS:http://localhost:3000}
  # Chave mestra de desenvolvimento em SIGSAN_DEV_MASTER_KEY (openssl rand -base64 32), fora do repositório.
  crypto:
    provider: ${SIGSAN_CRYPTO_PROVIDER:dev-env}
