# Configuração da aplicação ZIIPSAN. Nenhum segredo aqui: tudo que é senha, endereço ou chave vem de
# variável de ambiente, SEM valor padrão (a subida falha listando o que falta). Ver .env.example.
spring:
  application:
    name: ziipsan
  main:
    web-application-type: servlet
  # O Flyway do Boot fica DESLIGADO: com flyway-core no classpath ele varreria db/migration de forma
  # recursiva e aplicaria as migrations de tenant em public. Quem migra é o DatabaseMigrator (platform).
  flyway:
    enabled: false
  jpa:
    open-in-view: false
  # P0.14 (BFF): sessao no PostgreSQL (spring-session-jdbc, tabelas core V5).
  # No Boot 4.1 NAO ha auto-config de sessao: a propriedade spring.session.* e
  # inerte, e a sessao e ligada por @EnableJdbcHttpSession em SecurityConfig
  # (timeout 1800s, tabela SPRING_SESSION, sem DDL — quem cria e o job migrate
  # da P0.6, e a api nao tem DDL). Nada de spring.session.* aqui para nao
  # sugerir um mecanismo que nao existe.
  # P0.14: client confidencial do BFF (realm ziipsan, ver infra/keycloak/realms).
  # O segredo vem do ambiente/cofre, SEM valor padrao: sem ele a subida falha, em
  # vez de subir um BFF que nao consegue trocar o codigo por token. Nunca no repo.
  security:
    oauth2:
      client:
        registration:
          ziipsan-bff:
            provider: keycloak
            client-id: ziipsan-bff
            client-secret: ${ZIIPSAN_BFF_CLIENT_SECRET}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: openid, profile, email
        provider:
          keycloak:
            issuer-uri: ${ZIIPSAN_OIDC_ISSUER}
  mvc:
    problemdetails:
      enabled: true
  # P0.16 fase 2 (decisão do dono, opção 1: backend modela os campos; flag
  # ligada): propriedade desconhecida no corpo é recusada com 422
  # (GlobalExceptionHandler.handleHttpMessageNotReadable), em vez de
  # descartada em silêncio. Cliente antigo em cache falha alto, não some dado.
  jackson:
    deserialization:
      fail-on-unknown-properties: true

server:
  port: ${ZIIPSAN_PORT:8090}
  # P0.16: honrar X-Forwarded-Proto/Host do proxy (o HSTS só é emitido quando a
  # requisição é vista como segura). Premissa: o proxy de produção envia
  # X-Forwarded-Proto; sem ele, atrás de um terminador TLS, a API veria HTTP
  # e não emitiria HSTS. Não há proxy no repositório.
  forward-headers-strategy: framework
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        # P0.8: health (publico, ver SecurityConfig) + metrics + prometheus (autenticados).
        # Sem metrics/prometheus aqui, os starters do pom nao expoem nada.
        include: health,metrics,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  metrics:
    # P0.8: latencia por rota SEM rotulo de tenant (o guarda TenantTagGuard remove
    # tenant/tenant_id de qualquer medidor fora da allowlist de negocio). Tags padrao do
    # Boot: method, uri (template, nunca ID concreto), status, outcome, exception.
    distribution:
      percentiles-histogram:
        http.server.requests: true
  tracing:
    # P0.8: amostragem total fora de prod (trafego baixo; prod reduz em application-prod.yml).
    # O span leva tenant_id via JwtTenantFilter; o trace_id correlaciona com o log (MDC).
    sampling:
      probability: 1.0

logging:
  # P0.8: logs JSON em todo perfil (prod usa ECS, ver application-prod.yml, que tambem e JSON).
  # Formato "logstash": e o JSON estruturado do Boot (nao existe formato chamado "json" —
  # os validos sao ecs, gelf, logstash ou uma classe qualificada; "json" derruba a subida).
  # O MDC ja carrega requestId (RequestIdFilter) e tenant (JwtTenantFilter); o formato
  # estruturado os inclui sem que nenhum log imprima corpo de requisicao ou dado pessoal.
  structured:
    format:
      console: logstash

ziipsan:
  db:
    url: ${ZIIPSAN_DB_URL}
    app-user: ${ZIIPSAN_DB_APP_USER:ziipsan_app}
    app-password: ${ZIIPSAN_DB_APP_PASSWORD}
    # Produção: false (migrations num job separado antes da troca de versão). Local/teste: true.
    migrate-on-startup: ${ZIIPSAN_DB_MIGRATE_ON_STARTUP:false}
  # P0.6: credenciais do migrador em prefixo proprio, SEM validacao. A api e o worker
  # nao exigem estas variaveis; so o perfil migrate as le (DataSourceConfig). As
  # variaveis de ambiente continuam as mesmas de antes (ZIIPSAN_DB_MIGRATOR_*).
  migrator:
    user: ${ZIIPSAN_DB_MIGRATOR_USER:ziipsan_migrator}
    password: ${ZIIPSAN_DB_MIGRATOR_PASSWORD:}
  oidc:
    issuer: ${ZIIPSAN_OIDC_ISSUER}
    jwk-set-uri: ${ZIIPSAN_OIDC_JWK_SET_URI:}
    audience: ${ZIIPSAN_OIDC_AUDIENCE:ziipsan-api}
  cors:
    allowed-origins: ${ZIIPSAN_CORS_ORIGINS:}
  # Provedor das chaves de cifra por tenant (CryptoConfig). Sem valor a aplicação não sobe. "dev-env"
  # (chave mestra em ZIIPSAN_DEV_MASTER_KEY) só fora de produção; o do Vault ainda não existe.
  crypto:
    provider: ${ZIIPSAN_CRYPTO_PROVIDER:}
  keycloak:
    admin:
      enabled: false
  # P0.16: rate limit e limite de corpo (valores padrão em ZiipsanProperties;
  # aqui, explícitos para documentar os tetos em vigor).
  rate-limit:
    enabled: true
    limit-per-minute: 1000
    window-seconds: 60
  body-limit:
    max-bytes: 1048576
